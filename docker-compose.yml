services:

  backend:
    build:
      context: ./backend
    container_name: livestock-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: livestock-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped